<!doctype html>
<html lang="en" data-page="apps">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>App Launcher &mdash; sample</title>
  <link rel="icon" href="../static/icons/launcher.svg">
  <link rel="stylesheet" href="../static/app.css">
  <style>
    /* The clock would date the screenshot, and the drag cursor implies the
       menu can be rearranged, which it can here -- both are noise in a still. */
    #tick { display: none; }
  </style>
  <script>
    /* A screenshot fixture for the README.
     *
     * It loads the real stylesheet and the real app.js, and stubs `fetch` with
     * a generic fleet -- so what you photograph is the actual UI, not a
     * hand-drawn mock that will quietly drift out of date. No launcher needs to
     * be running: open this file in a browser and screenshot it.
     *
     * Everything below is invented. Ports, versions and paths are chosen to
     * show the states worth seeing: an app that is running, one that is
     * stopped, one on https, a version from git describe, one with no version
     * source at all, and a document.
     */
    const SAMPLE = [
      {
        name: "launcher", label: "Apps Launcher", description: "This page - list, status and registration for the other apps",
        icon: "../static/icons/launcher.svg", type: "self", is_self: true, is_file: false,
        dir: "launcher", path: "C:\\Users\\you\\dev\\launcher", path_exists: true,
        command: "python", args: ["app.py"], port: 5058, url: "http://127.0.0.1:5058/",
        match: "launcher.app[.]py", autostart: true, running: true, pid: 4812, via: "match",
        has_logs: true, file: "", file_exists: null, note: "",
      },
      {
        name: "notes-api", label: "Notes API", description: "REST API for the notes service",
        icon: "../static/icons/braces.svg", type: "app", is_self: false, is_file: false,
        dir: "NotesApi", path: "C:\\Users\\you\\dev\\NotesApi", path_exists: true,
        command: "python", args: ["app.py"], port: 5055, url: "http://127.0.0.1:5055/",
        match: "NotesApi.app[.]py", autostart: true, running: true, pid: 21480, via: "match",
        has_logs: true, file: "", file_exists: null, note: "",
      },
      {
        name: "dashboard", label: "Metrics Dashboard", description: "Metrics dashboard, self-signed cert",
        icon: "../static/icons/gauge.svg", type: "app", is_self: false, is_file: false,
        dir: "Dashboard", path: "C:\\Users\\you\\dev\\Dashboard", path_exists: true,
        command: "python", args: ["app.py"], port: 5000, url: "https://localhost:5000/",
        match: "Dashboard.app[.]py", autostart: true, running: true, pid: 23468, via: "match",
        has_logs: true, file: "", file_exists: null, note: "",
      },
      {
        name: "inbox-worker", label: "Inbox Worker", description: "Background queue worker - email and chat",
        icon: "../static/icons/inbox.svg", type: "app", is_self: false, is_file: false,
        dir: "InboxWorker", path: "C:\\Users\\you\\dev\\InboxWorker", path_exists: true,
        command: "python", args: ["worker.py"], port: 5061, url: "http://127.0.0.1:5061/",
        match: "InboxWorker.worker[.]py", autostart: true, running: true, pid: 30800,
        via: "port", has_logs: false, file: "", file_exists: null, note: "",
      },
      {
        name: "reports", label: "Monthly Reports", description: "Monthly report builder",
        icon: "../static/icons/calendar.svg", type: "app", is_self: false, is_file: false,
        dir: "Reports", path: "C:\\Users\\you\\dev\\Reports", path_exists: true,
        command: "python", args: ["app.py"], port: 5057, url: "http://127.0.0.1:5057/",
        match: "Reports.app[.]py", autostart: true, running: true, pid: 35340, via: "match",
        has_logs: true, file: "", file_exists: null, note: "",
      },
      {
        name: "scheduler", label: "Job Scheduler", description: "Cron-style job runner - started on demand",
        icon: "../static/icons/default.svg", type: "app", is_self: false, is_file: false,
        dir: "Scheduler", path: "C:\\Users\\you\\dev\\Scheduler", path_exists: true,
        command: "node", args: ["server.js"], port: 5062, url: "http://127.0.0.1:5062/",
        match: "Scheduler.server[.]js", autostart: false, running: false, pid: null,
        via: "none", has_logs: true, file: "", file_exists: null, note: "",
      },
      {
        name: "system-snapshot", label: "System Snapshot", description: "Generated hardware and service snapshot",
        icon: "../static/icons/file.svg", type: "file", is_self: false, is_file: true,
        dir: "", path: "", path_exists: null,
        command: "", args: [], port: null, url: "/open/system-snapshot",
        match: "", autostart: false, running: false, pid: null, via: "file",
        has_logs: false,
        file: "C:\\Users\\you\\docs\\system-snapshot.html", file_exists: true, note: "",
      },
    ];

    const VERSIONS = {
      "launcher":        { version: "1.2.0",         source: "Apps Launcher" },
      "notes-api":       { version: "v2.3.1",        source: "package.json" },
      "dashboard":       { version: "v0.9.4",        source: "git describe" },
      "inbox-worker":    { version: "5736112-dirty", source: "git describe" },
      "reports":         { version: "",              source: "" },
      "scheduler":       { version: "1.4.0",         source: "VERSION" },
      "system-snapshot": { version: "2026-08-31",    source: "file modified" },
    };

    const REPLIES = {
      "/api/status":   { apps: SAMPLE, at: Date.now() / 1000, launcher_version: "1.2.0" },
      "/api/versions": { ok: true, versions: VERSIONS, launcher_version: "1.2.0" },
    };

    // Answer from the fixture instead of the network, so the page needs nothing
    // running and cannot accidentally show real data.
    window.fetch = (url) => {
      const path = String(url).split("?")[0];
      const body = REPLIES[path] || { ok: true, framable: true };
      return Promise.resolve({ ok: true, json: () => Promise.resolve(body) });
    };
  </script>
</head>
<body>
  <aside class="side">
    <div class="side-top">
      <a class="brand" href="#" title="App Launcher">
        <img class="ico" src="../static/icons/launcher.svg" alt="">
        <span class="label">App Launcher</span>
      </a>
      <button class="collapse" id="toggle" title="Collapse menu" aria-label="Collapse menu">
        <span class="when-wide" aria-hidden="true">&#8249;</span>
        <span class="when-rail" aria-hidden="true">&#8250;</span>
      </button>
    </div>

    <nav class="side-nav">
      <a href="#" class="side-item on" title="Apps">
        <span class="glyph" aria-hidden="true">&#9635;</span>
        <span class="label">Apps</span>
      </a>
    </nav>

    <div class="side-label"><span class="label">Apps</span></div>
    <nav class="side-apps" id="side-apps"></nav>

    <div class="side-label" id="files-label" hidden><span class="label">Files</span></div>
    <nav class="side-apps" id="side-files" hidden></nav>

    <div class="side-foot">
      <button class="side-item add-item" id="side-add" title="Register an app">
        <span class="glyph" aria-hidden="true">+</span>
        <span class="label">Register an app</span>
      </button>
      <div class="side-version" id="side-version"></div>
    </div>
  </aside>

  <div class="content">
    <header class="topbar">
      <div class="topbar-id first">
        <img class="tb-icon" id="tb-icon" src="" alt="" hidden>
        <div class="tb-text">
          <span class="tb-name" id="tb-name">Apps</span>
          <span class="tb-meta" id="tb-meta"></span>
        </div>
      </div>
      <div class="topbar-actions" id="topbar-actions"></div>
      <span id="tick" class="tick"></span>
    </header>

    <main>
      <section id="dash" class="dash">
        <div class="dash-tools">
          <button class="btn primary" data-action="start" data-name="">Start all</button>
          <button class="btn" id="refresh">Refresh</button>
          <button class="btn" id="dash-add">+ Register an app</button>
          <span class="dash-count" id="dash-count"></span>
          <div class="viewswitch" role="group" aria-label="Layout">
            <button class="btn" id="view-list" data-view="list">List</button>
            <button class="btn" id="view-grid" data-view="grid">Tiles</button>
          </div>
        </div>
        <p class="dash-hint">
          Click an app to open it here. Drag the rows in the menu to reorder them --
          that order is what the logon task starts in.
        </p>
      </section>

      <script id="initial-data" type="application/json">[]</script>
      <section id="list" class="applist"></section>
      <section id="grid" class="grid" hidden></section>

      <section id="viewer" class="viewer" hidden>
        <p class="viewer-note" id="viewer-note" hidden></p>
        <div class="viewer-body">
          <iframe id="viewer-frame" title="App" src="about:blank"></iframe>
          <div class="viewer-empty" id="viewer-empty" hidden></div>
        </div>
      </section>
    </main>
  </div>

  <div id="toast" class="toast" hidden></div>

  <div id="sheet" class="sheet" hidden>
    <div class="sheet-inner">
      <div class="sheet-head">
        <h2 id="sheet-title">Output</h2>
        <button class="btn ghost" id="sheet-close">Close</button>
      </div>
      <pre id="sheet-body"></pre>
    </div>
  </div>

  <!-- The form the real page has; unused here, but app.js binds to it. -->
  <dialog id="add-dialog">
    <form id="add-form" method="dialog">
      <h2 id="form-title">Register an app</h2>
      <p class="hint" id="form-hint"></p>
      <label>Name <input name="name"><small id="name-help"></small></label>
      <label class="file-only" hidden>File <input name="file"></label>
      <label class="app-only">Path <input name="dir"></label>
      <div class="row app-only">
        <label>Command <input name="command" value="python"></label>
        <label>Arguments <input name="args"></label>
      </div>
      <div class="row app-only">
        <label>Port <input name="port" type="number"></label>
        <label>URL <input name="url"></label>
      </div>
      <label>Description <input name="description"></label>
      <div class="row app-only">
        <label>Version <input name="version"></label>
        <label>Version command <input name="version_cmd"></label>
      </div>
      <label class="app-only">Match pattern <input name="match"></label>
      <label class="check app-only"><input type="checkbox" name="autostart" checked> Start at logon</label>
      <p class="err" id="add-err" hidden></p>
      <div class="sheet-head end">
        <button type="button" class="btn ghost" id="add-cancel">Cancel</button>
        <button type="submit" class="btn primary" id="form-submit">Add app</button>
      </div>
    </form>
  </dialog>

  <script src="../static/app.js"></script>
</body>
</html>
